<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | RENTAL MOBIL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-yellow: #ffb800;
            --bg-dark: #07090e;
            --card-bg: #11141e;
            --text-main: #ffffff;
            --text-muted: #8b8e99;
            --border-color: #1e2235;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 0 40px 50px; min-height: 100vh;}
        
        /* Navbar matching Client Web */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 30px 0; border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
        }
        .logo { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: 1px; text-transform: uppercase;}
        .logo span { color: var(--primary-yellow); }
        .btn-refresh {
            background: transparent; color: var(--primary-yellow);
            border: 1px solid var(--primary-yellow); padding: 10px 24px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: 0.3s;
        }
        .btn-refresh:hover { background: var(--primary-yellow); color: #000; }

        /* Dashboard Overview */
        .stats-container { display: flex; gap: 20px; margin-bottom: 40px; }
        .stat-card {
            flex: 1; background: var(--card-bg); padding: 30px;
            border-radius: 12px; border: 1px solid var(--border-color);
        }
        .stat-card h3 { color: var(--text-muted); font-size: 13px; text-transform: uppercase; margin-bottom: 10px; font-weight: 600; letter-spacing: 1px;}
        .stat-card p { font-size: 38px; font-weight: 800; color: var(--primary-yellow); }

        /* Sections & Tables */
        .table-wrapper {
            background: var(--card-bg); padding: 35px;
            border-radius: 12px; border: 1px solid var(--border-color);
            margin-bottom: 40px; overflow-x: auto;
        }
        .section-title { font-size: 22px; font-weight: 800; margin-bottom: 25px; color: #fff; }
        
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { padding: 18px 20px; text-align: left; font-size: 14px; }
        th { color: var(--text-muted); text-transform: uppercase; font-size: 12px; border-bottom: 1px solid var(--border-color); letter-spacing: 1px;}
        td { border-bottom: 1px solid rgba(30, 34, 53, 0.5); }
        tr:hover td { background: rgba(255, 255, 255, 0.03); }

        /* Status & Buttons */
        .status-badge { padding: 6px 14px; border-radius: 4px; font-size: 12px; font-weight: 800; text-transform: uppercase;}
        .badge-pending { background: rgba(255, 184, 0, 0.1); color: var(--primary-yellow); }
        .badge-returned { background: rgba(0, 230, 118, 0.1); color: #00e676; }
        
        .btn-return {
            background: var(--primary-yellow); color: #000; border: none;
            padding: 8px 16px; border-radius: 4px; font-weight: 800; font-size: 12px;
            cursor: pointer; transition: 0.2s;
        }
        .btn-return:hover { background: #e6a600; }
        .btn-disabled {
            background: #1e2235; color: var(--text-muted); border: none;
            padding: 8px 16px; border-radius: 4px; font-weight: 800; font-size: 12px;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">RENTAL <span>MOBIL</span> ADMIN</div>
        <button class="btn-refresh" onclick="loadData()">Refresh Database</button>
    </div>

    <div class="stats-container">
        <div class="stat-card">
            <h3>Total Bookings (All Time)</h3>
            <p id="totalBookings">0</p>
        </div>
        <div class="stat-card">
            <h3>Expected Revenue</h3>
            <p id="totalIncome">₱0</p>
        </div>
    </div>

    <div class="table-wrapper">
        <h2 class="section-title">Client Reservations</h2>
        <table>
            <thead>
                <tr>
                    <th>Booking ID</th>
                    <th>Client Name</th>
                    <th>Pickup Date</th> <!-- BAGO: Date Column -->
                    <th>Car ID</th>
                    <th>Duration</th>
                    <th>Total Fee</th>
                    <th>Payment Mode</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="admin-table-body">
                <tr><td colspan="9" style="text-align:center;">Loading reservations...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="table-wrapper">
        <h2 class="section-title">Direct Inquiries / Messages</h2>
        <table>
            <thead>
                <tr>
                    <th style="width: 10%;">Msg ID</th>
                    <th style="width: 25%;">Client Name</th>
                    <th style="width: 25%;">Email Address</th>
                    <th style="width: 40%;">Message</th>
                </tr>
            </thead>
            <tbody id="messages-table-body">
                <tr><td colspan="4" style="text-align:center;">Loading messages...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadData() {
            fetchReservations();
            fetchMessages();
        }

        async function fetchReservations() {
            try {
                const response = await fetch('http://localhost:8080/api/reservations');
                const data = await response.json();
                const tbody = document.getElementById('admin-table-body');
                let totalIncome = 0;

                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;">No reservations yet.</td></tr>`;
                    document.getElementById('totalBookings').innerText = "0";
                    return;
                }

                tbody.innerHTML = data.map(res => {
                    totalIncome += res.totalFee;
                    const isReturned = res.status === 'Returned';
                    const badgeClass = isReturned ? 'status-badge badge-returned' : 'status-badge badge-pending';
                    
                    const actionBtn = isReturned 
                        ? `<button class="btn-disabled" disabled>Returned</button>`
                        : `<button class="btn-return" onclick="returnCar(${res.id})">Mark Returned</button>`;

                    // Format date fallback kung walang date na na-save noon
                    const displayDate = res.rentalDate ? res.rentalDate : "Not Specified";

                    return `
                    <tr>
                        <td style="color: var(--text-muted);">#${res.id}</td>
                        <td style="color: #fff; font-weight:600;">${res.customerName}</td>
                        <td style="color: var(--primary-yellow); font-weight:600;">${displayDate}</td>
                        <td>Car ID: ${res.carId}</td>
                        <td>${res.rentalDays} Days</td>
                        <td style="font-weight:600;">₱${res.totalFee.toLocaleString()}</td>
                        <td>${res.paymentMethod}</td>
                        <td><span class="${badgeClass}">${res.status}</span></td>
                        <td>${actionBtn}</td>
                    </tr>`;
                }).join('');

                document.getElementById('totalBookings').innerText = data.length;
                document.getElementById('totalIncome').innerText = `₱${totalIncome.toLocaleString()}`;
            } catch (error) {
                console.error("Error fetching reservations:", error);
            }
        }

        async function fetchMessages() {
            try {
                const response = await fetch('http://localhost:8080/api/messages');
                const data = await response.json();
                const tbody = document.getElementById('messages-table-body');

                if(data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No new messages.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(msg => `
                    <tr>
                        <td style="color: var(--text-muted);">#${msg.id}</td>
                        <td style="color: #fff; font-weight:600;">${msg.name}</td>
                        <td style="color: var(--primary-yellow);">${msg.email}</td>
                        <td style="line-height: 1.6;">${msg.message}</td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error("Error fetching messages:", error);
            }
        }

        async function returnCar(reservationId) {
            if(confirm("Action: Is the client returning the car now? This will make the unit vacant again in the catalog.")) {
                try {
                    const response = await fetch(`http://localhost:8080/api/reservations/${reservationId}/return`, {
                        method: 'POST'
                    });
                    const result = await response.text();
                    alert(result);
                    loadData(); // Auto-refresh UI
                } catch (error) {
                    alert("Error communicating with server.");
                }
            }
        }

        loadData();
    </script>
</body>
</html>
